[project]
name = "go-running-route-q-learning-analysis"
version = "0.1.0"
description = "Python analysis environment for CSV artifacts produced by the Go running-route CLI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]

# The application is written in Go; Python provides an analysis environment only.
[tool.uv]
package = false
