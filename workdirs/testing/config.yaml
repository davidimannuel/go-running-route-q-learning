schema_version: 1

map:
  latitude: -7.281518
  longitude: 112.710178
  radius_m: 3025
  timeout_sec: 90

output_dir: output
cache_dir: cache

qlearning:
  # B observes the current node and distance-progress bin.
  scenario: B
  environment:
    target_distance_m: 5000
    distance_tolerance: 0.10
    progress_bins: 16
    max_steps: 220
    allow_revisit: true
    revisit_after_ratio: 0.50
    max_node_visits: 2
    max_snap_distance_m: 100
  training:
    episodes: 150000
    epsilon_decay_episodes: 50000
    alpha: 0.15
    gamma: 0.95
    epsilon_start: 1.0
    epsilon_end: 0.05
    # Omit seeds to select five distinct random seeds on each train invocation.
    # To repeat a run, replace runs with seeds copied from its metadata.json.
    runs: 5
    max_workers: 3
